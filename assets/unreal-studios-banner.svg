<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Unreal Studios — Build Beyond Ordinary</title>
<desc id="desc">Animated purple and midnight-black GitHub profile banner with luminous orbital geometry, moving star particles, scanning accents, and the Unreal Studios wordmark.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#070811"/><stop offset="52%" stop-color="#121024"/><stop offset="100%" stop-color="#080914"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F0E6FF"/><stop offset="42%" stop-color="#B995FF"/><stop offset="100%" stop-color="#7C4DFF"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#432566" stop-opacity="0"/><stop offset="40%" stop-color="#B59CFF"/><stop offset="100%" stop-color="#432566" stop-opacity="0"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#9E68FF" stop-opacity=".32"/><stop offset="58%" stop-color="#7540DE" stop-opacity=".13"/><stop offset="100%" stop-color="#7540DE" stop-opacity="0"/></radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A882FF" stop-opacity="0"/><stop offset=".5" stop-color="#CDB6FF" stop-opacity=".6"/><stop offset="1" stop-color="#A882FF" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#B38AFA" stroke-width="1" opacity=".095"/></pattern>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#CBABFF" opacity=".20"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="frame"><rect x="1" y="1" width="1198" height="438" rx="17"/></clipPath>
  <style><![CDATA[
    .mono{font-family:Consolas,"Liberation Mono",monospace}
    .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}
    .blink{animation:blink 1.2s steps(2,end) infinite}
    .flash{animation:flash 4s ease-in-out infinite}
    .star{animation:star 3.5s ease-in-out infinite}
    .star2{animation:star 4.7s ease-in-out -2s infinite}
    .scan{animation:scan 9s linear infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.10}}
    @keyframes flash{0%,100%{opacity:.34}50%{opacity:.9}}
    @keyframes star{0%,100%{opacity:.18}50%{opacity:1}}
    @keyframes scan{0%{transform:translateX(-1250px)}100%{transform:translateX(1400px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  ]]></style>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#grid)"/>
  <rect x="600" width="600" height="440" fill="url(#dots)"/>
  <circle cx="950" cy="216" r="360" fill="url(#aura)"><animate attributeName="r" values="335;380;335" dur="10s" repeatCount="indefinite"/></circle>
  <path d="M-10 420 420 -10 M180 450 620 -10 M370 450 820 -10" stroke="#8669D8" opacity=".06" stroke-width="2"/>
  <path d="M0 2H1200" stroke="url(#edge)" stroke-width="3"/>
  <path d="M0 438H1200" stroke="url(#edge)" stroke-width="2" opacity=".55"/>
  <rect x="-150" y="0" width="220" height="440" fill="url(#beam)" opacity=".18" class="scan"/>
  <g class="mono" fill="#AF9ACD" font-size="13" letter-spacing="1.4">
    <text x="65" y="57">●  U N R E A L  /  S T U D I O S</text>
    <text x="1137" y="57" text-anchor="end">DEV / PROFILE  —  001</text>
  </g>
  <circle cx="69" cy="51.5" r="3.5" fill="#AD78FF" class="flash"/>
  <path d="M65 78H548" stroke="#9E79E3" opacity=".30"/>
  <rect x="65" y="112" width="5" height="177" rx="2" fill="#9E72FF"/>
  <rect x="65" y="112" width="5" height="82" rx="2" fill="#DBBAFF" opacity=".86"><animate attributeName="y" values="112;208;112" dur="5s" repeatCount="indefinite"/></rect>
  <g class="sans" font-weight="800" letter-spacing="-3">
    <text x="94" y="192" font-size="83" fill="#F8F5FF">UNREAL</text>
    <text x="94" y="282" font-size="83" fill="url(#purple)">STUDIOS</text>
  </g>
  <text x="98" y="326" class="mono" font-size="17" fill="#C8B9E3" letter-spacing="1.5">BUILD BEYOND ORDINARY.</text>
  <text x="98" y="354" class="sans" font-size="15" fill="#978CA9">Software engineering  /  FiveM  /  connected experiences</text>
  <path d="M98 383H543" stroke="#8C70BF" stroke-opacity=".38"/>
  <text x="98" y="409" font-size="12" class="mono" fill="#8A7EA6" letter-spacing="2">ITZ-FUTURE  ·  INDEPENDENT CREATOR</text>
  <g opacity=".80">
    <path d="M680 109H740M680 109V139M1146 109H1086M1146 109V139M680 337H740M680 337V307M1146 337H1086M1146 337V307" fill="none" stroke="#8C65D7" stroke-width="1.5" opacity=".5"/>
    <circle cx="914" cy="222" r="166" fill="none" stroke="#956BE1" stroke-width="1" opacity=".20"/>
    <circle cx="914" cy="222" r="149" fill="none" stroke="#AC84FF" stroke-width="1.3" stroke-dasharray="3 10" opacity=".43">
      <animateTransform attributeName="transform" type="rotate" from="0 914 222" to="360 914 222" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle cx="914" cy="222" r="124" fill="none" stroke="#BD9DFF" stroke-width="2" stroke-dasharray="132 38 7 62" opacity=".64">
      <animateTransform attributeName="transform" type="rotate" from="0 914 222" to="-360 914 222" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle cx="914" cy="222" r="108" fill="none" stroke="#976BF0" stroke-width="1.5" stroke-dasharray="3 15" opacity=".65">
      <animateTransform attributeName="transform" type="rotate" from="0 914 222" to="360 914 222" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="914" cy="222" r="84" fill="#170E2B" fill-opacity=".38" stroke="#B68BFF" stroke-width="1.5" opacity=".82"/>
    <circle cx="914" cy="222" r="69" fill="none" stroke="#C7A4FF" stroke-opacity=".22"/>
    <path d="M914 49V395 M741 222H1087" stroke="#A077F0" opacity=".17"/>
    <path d="M815 123l198 198M1013 123 815 321" stroke="#A077F0" opacity=".12"/>
    <path d="M876 194V237L914 260L952 237V194" fill="none" stroke="#B995FF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M889 194V229L914 244L939 229V194" fill="none" stroke="#F4EAFF" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
    <path d="M894 181H934" stroke="#D7BEFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="914" cy="222" r="52" fill="none" stroke="#E5C9FF" stroke-width="1.5" opacity=".4"><animate attributeName="r" values="49;59;49" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".48;.06;.48" dur="4s" repeatCount="indefinite"/></circle>
    <g>
      <circle cx="914" cy="73" r="4.5" fill="#E3CBFF"/><circle cx="914" cy="73" r="12" fill="#A770FF" opacity=".4" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 914 222" to="360 914 222" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="1038" cy="222" r="4" fill="#F5DDFF"/><circle cx="1038" cy="222" r="12" fill="#C193FF" opacity=".5" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 914 222" to="-360 914 222" dur="18s" repeatCount="indefinite"/>
    </g>
  </g>
  <g fill="#D2B7FF"><circle class="star" cx="631" cy="87" r="2"/><circle class="star2" cx="1118" cy="149" r="2"/><circle class="star" cx="749" cy="369" r="1.5"/><circle class="star2" cx="1150" cy="353" r="2"/><circle class="star" cx="603" cy="270" r="1.5"/></g>
  <g fill="#9E88BF" font-family="Consolas,monospace" font-size="10" letter-spacing="1">
    <text x="688" y="104">SYSTEM // U-01</text>
    <text x="1128" y="357" text-anchor="end">ENDLESS ITERATION</text>
    <text x="680" y="382">DESIGN  ◇  ENGINEER  ◇  SHIP</text>
  </g>
</g>
<rect x="1" y="1" width="1198" height="438" rx="17" fill="none" stroke="#72539F" stroke-opacity=".38"/>
</svg>